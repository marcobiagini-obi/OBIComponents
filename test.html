<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>AMBIENTE DI TEST</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,-25" />
    <link type='text/css' rel='stylesheet'
        href='http://swita000006.de.obi.net/_webframework/OBIComponents.dev/style/StyleBundle.css'>
    <script type='module'
        src='http://swita000006.de.obi.net/_webframework/OBIComponents.dev/componentsBundle.js'></script>

    <style>
        [dettagli] {
            display: grid;
            grid-template: "anag anag anag"
                "step content content";

            [process] {
                grid-area: step;
                width: 200px;
            }

            [content] {
                grid-area: content;
            }

            [anag] {
                grid-area: anag;
                display: flex;
                flex-direction: row;

                [obi-card] {
                    flex-grow: 1;
                }

                [details] {
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                }
            }
        }
    </style>
</head>

<body>
    <obi-app id="testApp" titolo="TEST DETTAGLI">
        <app-content display-column>
            <section header display-row="wrap">
                <obi-card size="lg" titolo="#TRS003EQWF" descrizione="003 Imola" flex-size="1" strong
                    prepend="<obi-icon nome='local_shipping'></obi-icon>">
                </obi-card>
                <div general display-row="wrap" flex-center>
                    <obi-card interact flex-size="1" titolo="Marco Biagini"
                        descrizione="Piazza dei Cedri 2, Pistoia, PT 51100, IT" variant="filled" margin="sm"
                        relevance="neutral" prepend="<obi-icon nome='person'></obi-icon>"
                        @click="$.cliente.open()"></obi-card>
                    <obi-card interact flex-size="1" titolo="VG GROUP CONSULTING S.R.L." descrizione="03841760360"
                        variant="filled" margin="sm" relevance="neutral"
                        prepend="<obi-icon nome='local_shipping'></obi-icon>"
                        @click="$.trasportatore.open()"></obi-card>
                    <div flex-size="1" display-column rounded variant="outlined" style="border: solid 1px;" padding="xs"
                        margin="sm">
                        <obi-label margin="sm" label="Referente:" :valore="pratica.referente"></obi-label>
                        <obi-label margin="sm" label="Prenotazione:" :valore="pratica.prenotazione"></obi-label>
                    </div>
                </div>
                <div style="display: flex; flex-direction: row-reverse;">
                    <obi-button margin="sm" title="COMUNICAZIONI" relevance="secondary" flex-end
                        @click="$.chatting=!$.chatting">
                        <obi-icon nome="chat"></obi-icon>
                    </obi-button>
                </div>
            </section>
            <section content display-row style="align-items: flex-start;">
                <div process>
                    <obi-stepper :steps="processo" column :active="pratica.idstato" interact></obi-stepper>
                </div>
                <section flex-size="1" display-column>
                    <obi-tab>
                        <tab-item titolo="Processo" icona="dashboard" :attivo="$.view == 'dashboard'"
                            @click="$.view = 'dashboard'"></tab-item>
                        <tab-item titolo="Anagrafica" icona="info" :attivo="$.view == 'anag'"
                            @click="$.view = 'anag'"></tab-item>
                        <tab-item titolo="Documenti" icona="draft" :attivo="$.view == 'docs'"
                            @click="$.view = 'docs'"></tab-item>
                    </obi-tab>
                    <obi-card titolo="SCHEDA DI TRASPORTO" name="anag" variant="filled" cmd-if="$.view == 'anag'">
                        <card-action display-row>
                            <obi-button cmd-if="$.pratica.idstato==1" relevance="primary" label="modifica"
                                prepend="edit"></obi-button>
                            <obi-button relevance="secondary" label="stampa" prepend="print"></obi-button>
                        </card-action>
                        <card-body>
                            <div display-row="wrap" margin="sm">
                                <obi-chip style="margin-right: 8px;" relevance="neutral" prepend="location_on"
                                    :label="'Distanza: ' + $.pratica.distanza + 'Km'"></obi-chip>
                                <obi-chip style="margin-right: 8px;" relevance="neutral"
                                    :label="$.pratica.piano ? 'Piano: ' + $.pratica.piano : 'Piano Terra'"
                                    prepend="meeting_room"></obi-chip>
                                <obi-chip style="margin-right: 8px;"
                                    :label="'Preventivo: ' + $.pratica.preventivo + '€'" relevance="primary"></obi-chip>
                            </div>
                            <div diplay-column>
                                <obi-headline label="UNITA' DI SPEDIZIONE"></obi-headline>
                                <div display-row>
                                    <obi-card margin="sm" cmd-for="unit in pratica.unitaSpedizione" relevance="neutral">
                                        <card-body display-row flex-top margin-side="sm">
                                            <div display-column>
                                                <obi-headline label="QUANTITÅ"></obi-headline>
                                                <obi-label icona="weight" label="Peso:"
                                                    :valore="$.unit.peso + 'Kg'"></obi-label>
                                                <obi-label icona="expand_content" label="Dimensioni (LxPxA):"
                                                    :valore="$.unit.larghezza + 'cm - ' + $.unit.profondita+ 'cm - ' + $.unit.altezza + 'cm'"></obi-label>
                                                <obi-label icona="pallet" label="Bancali:"
                                                    :valore="$.unit.bancali"></obi-label>
                                            </div>
                                            <div display-column margin-side="md">
                                                <obi-headline label="DETTAGLI"></obi-headline>
                                                <obi-label label="Aspetto Merce:" :valore="$.unit.nomeAspetto"
                                                    margin-topdown="sm"></obi-label>
                                                <obi-label label="Tipologia Merce:" :valore="$.unit.nomeTipo"
                                                    margin-topdown="sm"></obi-label>
                                            </div>
                                        </card-body>
                                    </obi-card>
                                </div>
                            </div>
                        </card-body>
                    </obi-card>
                    <obi-card titolo="" name="docs" variant="filled" cmd-elseif="$.view == 'docs'">
                        <obi-filecard flex-size="unset" relevance="secondary" cmd-for="file in attachments"
                            :file="file"></obi-filecard>
                    </obi-card>
                    <div name="dashboard" cmd-else>
                        <obi-card cmd-if="$.pratica.idstato==1" titolo="INSERITO" variant="filled">
                            <card-body display-row="wrap" style="align-items: flex-start;">
                                <obi-card flex-size="1" relevance="neutral" prepend="<obi-icon nome='check'></obi-icon>"
                                    titolo="Compila la scheda di trasporto"
                                    descrizione="Eseguito da mbiagini in data 01/10/2024">
                                    <card-body></card-body>
                                    <card-action>
                                        <obi-button label="Modifica i dati" prepend="edit"></obi-button>
                                    </card-action>
                                </obi-card>
                                <obi-card flex-size="1" relevance="neutral" prepend="<obi-icon nome='check'></obi-icon>"
                                    titolo="Carica la scheda di trasporto firmata"
                                    descrizione="Eseguito da mbiagini in data 01/10/2024">
                                    <card-body>
                                        <obi-filecard flex-size="unset" relevance="secondary"
                                            :file="$.attachments[0]"></obi-filecard>
                                    </card-body>
                                    <card-action>
                                        <obi-button label="carica il documento" prepend="draft"></obi-button>
                                    </card-action>
                                </obi-card>
                            </card-body>
                        </obi-card>
                        <obi-card cmd-elseif="$.pratica.idstato==2" titolo="ATTESA RITIRO MERCE" variant="filled">
                            <card-body display-row="wrap" style="align-items: flex-start;">
                                <obi-card flex-size="1" relevance="neutral" prepend="<obi-icon nome='check'></obi-icon>"
                                    titolo="Comunica la disponibilità della merce"
                                    descrizione="Eseguito da mbiagini in data 01/10/2024">
                                    <card-body></card-body>
                                    <card-action>
                                        <obi-button label="contatta il fornitore" prepend="email"></obi-button>
                                    </card-action>
                                </obi-card>
                                <obi-card flex-size="1" relevance="dark" prepend="<obi-icon nome='circle'></obi-icon>"
                                    titolo="Caricare il buono di consegna" descrizione="">
                                    <card-body></card-body>
                                    <card-action>
                                        <obi-button label="carica il documento" prepend="draft"
                                            relevance="primary"></obi-button>
                                    </card-action>
                                </obi-card>
                            </card-body>
                        </obi-card>
                    </div>
                </section>
            </section>
            <obi-sideview chat :display="chatting" style="position: fixed; right: 0; height: 90%; min-width: 600px;">
                <obi-card variant="filled" style="height: 100%;">
                    <div display-row margin-side="lg" margin-topdown="sm">
                        <obi-title flex-size="auto" titolo="COMUNICAZIONI"></obi-title>
                        <obi-button icon @click='$.chatting=false'><obi-icon nome='close'></obi-icon></obi-button>
                    </div>
                    <card-body>
                        <obi-tab variant="filled" flex-size="unset">
                            <tab-item titolo="Messaggi" icona="chat" :attivo="$.chatview == 'chat'"
                                @click="$.chatview = 'chat'"></tab-item>
                            <tab-item titolo="Storico" icona="history" :attivo="$.chatview == 'history'"
                                @click="$.chatview = 'history'"></tab-item>
                        </obi-tab>
                        <obi-chat cmd-if="$.chatview == 'chat'"></obi-chat>
                        <div cmd-elseif="$.chatview == 'history'">
                            <obi-list x2 flex-size="1">
                                <list-item title-size="subtitle1" cmd-for="item in storico" :variant="item.tipo"
                                    relevance="secondary" rounded margin-topdown="xs" :testo="item.titolo"
                                    :descrizione="item.descrizione" :prepend="item.icona"
                                    :append="item.comment"></list-item>
                            </obi-list>
                        </div>
                    </card-body>
                </obi-card>
            </obi-sideview>

            <obi-modal focus size="file" name="cliente">
                <obi-card titolo="Dettagli Cliente" prepend="<obi-icon nome='person'></obi-icon>">
                    <card-body>
                        <obi-label margin="sm" label="Nome:" valore="Marco"></obi-label>
                        <obi-label margin="sm" label="Cognome:" valore="Biagini"></obi-label>
                        <obi-label margin="sm" label="Codice Fiscale:" valore="BGNMRC96H27D612F"></obi-label>
                        <obi-label margin="sm" label="Email:" valore="marco.biagini@obi-italia.it"></obi-label>
                        <obi-label margin="sm" label="Telefono:" valore="+39 349-736-0601"></obi-label>
                        <obi-label margin="sm" label="Indirizzo:"
                            valore="Piazza dei Cedri 2, Pistoia, PT 51100, IT"></obi-label>
                    </card-body>
                    <card-action>
                        <obi-button relevance="tertiary" prepend="email" label="contatta"></obi-button>
                    </card-action>
                </obi-card>
            </obi-modal>
            <obi-modal focus size="file" name="trasportatore">
                <obi-card titolo="Dettagli Trasportatore" prepend="<obi-icon nome='local_shipping'></obi-icon>">
                    <card-body>
                        <obi-label margin="sm" label="Ragione Sociale:" valore="VG GROUP CONSULTING S.R.L."></obi-label>
                        <obi-label margin="sm" label="Codice:" valore="02719240414"></obi-label>
                        <obi-label margin="sm" label="Email:" valore="st.servizietrasporti@gmail.com"></obi-label>
                        <obi-label margin="sm" label="Telefono:" valore="+39 392-926-3626"></obi-label>
                    </card-body>
                    <card-action>
                        <obi-button relevance="tertiary" prepend="email" label="contatta"></obi-button>
                    </card-action>
            </obi-modal>
        </app-content>
    </obi-app>

    <script type="module">
        import RenderEngine from "http://swita000006.de.obi.net/_webframework/OBIComponents.dev/LAMP/RenderModule/LampRender.js";
        RenderEngine.instance.start("testApp").build({
            dataset: {
                processo: [
                    { id: 1, label: "Inserito", status: 1 },
                    { id: 2, label: "Attesa Ritiro Merce", status: 0 },
                    { id: 3, label: "In Consegna", status: 0 },
                    { id: 4, label: "Consegnato", status: 0 },
                ],
                pratica: {
                    idstato: 1,
                    referente: "Loris",
                    prenotazione: 52000039426,
                    distanza: 15,
                    facchinaggio: false,
                    piano: 0,
                    trasporto: 0,
                    ascensore: false,
                    stradaStretta: false,
                    ztl: false,
                    note: "",
                    preventivo: 100.0,
                    unitaSpedizione: [
                        {
                            peso: 3.240,
                            colli: 1,
                            bancali: 3,
                            larghezza: 120,
                            altezza: 180,
                            profondita: 80,
                            aspetto: 1,
                            tipo: 2,
                            nomeAspetto: "Pallet",
                            nomeTipo: "Pellet e Legna",
                        }
                    ]
                },
                attachments: [
                    {
                        name: "Scheda di Trasporto",
                        size: 2000,
                        application: "application/pdf",
                        data: null,
                    }
                ],
                storico: [
                    {
                        titolo: "Comunicazione email automatica",
                        descrizione: "Inviata una email automatica",
                        utente: "lceccarini",
                        data: "10-10-2024",
                        icona: "<obi-icon relevance='warning' nome='email'></obi-icon>",
                        tipo: "warning",
                        comment: "<span font-type='caption'>lceccarini<br>10-10-24</span>"
                    },
                    {
                        titolo: "Passaggio di Stato",
                        descrizione: "Passaggio di stato da Inserito a Attesa Ritiro Merce",
                        utente: "lceccarini",
                        data: "10-10-2024",
                        icona: "<obi-icon relevance='primary' nome='history'></obi-icon>",
                        tipo: "primary",
                        comment: "<span font-type='caption'>lceccarini<br>10-10-24</span>"
                    },
                    {
                        titolo: "Caricato documento",
                        descrizione: "Caricato il documento Scheda di Trasporto",
                        utente: "lceccarini",
                        data: "10-10-2024",
                        icona: "<obi-icon relevance='neutral' nome='draft'></obi-icon>",
                        tipo: "neutral",
                        comment: "<span font-type='caption'>lceccarini<br>10-10-24</span>"
                    },
                    {
                        titolo: "Calcolo Preventivo",
                        descrizione: "Calcolato preventivo del valore di 58€",
                        utente: "lceccarini",
                        data: "10-10-2024",
                        icona: "<obi-icon relevance='info' nome='edit'></obi-icon>",
                        tipo: "info",
                        comment: "<span font-type='caption'>lceccarini<br>10-10-24</span>"
                    },
                    {
                        titolo: "Apertura della pratica di trasporto",
                        descrizione: "Avviata pratica di Trasporto con stato Inserito",
                        utente: "lceccarini",
                        data: "10-10-2024",
                        icona: "<obi-icon relevance='primary' nome='history'></obi-icon>",
                        tipo: "primary",
                        comment: "<span font-type='caption'>lceccarini<br>10-10-24</span>"
                    },
                ],
                view: "dashboard",
                chatview: "chat",
                chatting: false,
            }, //set di dati dell'applicazione
            storage: {}, //set di dati indipendenti dall'aggiornamento dinamico dell'interfaccia
            computed: {
                cliente: function () { return document.querySelector("[obi-modal][name='cliente']").virtual.context; },
                trasportatore: function () { return document.querySelector("[obi-modal][name='trasportatore']").virtual.context; }
            }, //set di dati in sola lettura dell'applicazione
            actions: {}, //funzioni dell'applicazione
            events: [], //eventi dell'applicazione
            settings: {
                interface: {
                    darkmode: false,
                }
            } //impostazioni dell'applicazione
        });

    </script>
</body>

</html>
