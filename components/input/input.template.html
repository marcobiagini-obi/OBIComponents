<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,-25" />
    <link type='text/css' rel='stylesheet' href='../../style/StyleBundle.css'>
    <script type='module' src='../../componentsBundle.js'></script>
</head>

<body>

    <div id="template" display-grid="blog" margin="xl" paddin="xl" gap="xl">
        <section name="input-container" grid-article display-column gap="md">
            <obi-combobox label="demo combobox" :valore="valoreCombobox" :opzioni="listaCombobox" :messaggio="valoreCombobox"></obi-combobox>
            <obi-chiplist label="Demo Chiplist" :valore="selezione" :opzioni="negozi" select-mode="single"></obi-chiplist>
            {{"Valori Selezionati: " + $.selezione.join(', ')}}
            <obi-textbox label="Prova" count='10'></obi-textbox>
            <obi-textarea label="Prova" :valore="testo" enable-format></obi-textarea>
            <obi-button @click="submitTextarea" label="submit"></obi-button>
            <obi-file multiple></obi-file>
            <obi-date :valore="now" label="Prova Datetime"></obi-date>
            <obi-codeblock label="Demo Codeblock" language="sql" :valore="codiceDemo"></obi-codeblock>
            {{testo}}
        </section>

    </div>

    <script type="module">
        import RenderEngine from "../../LAMP/RenderModule/LampRender.js";
        import { Support } from '../../LAMP/RenderModule/modules/library.js';

        RenderEngine.instance.start("template").build({
            dataset: {
                selezione: [1, 4, 5, 6],
                negozi: [],
                now: null,
                testo: "",
                codiceDemo: 'SELECT * FROM ITS_UTENTI..Utenti WHERE ID = 2571',
                listaCombobox: [
                    { label: "Opzione 1", value: 1 },
                    { label: "Opzione 2", value: 2 },
                    { label: "Opzione 3", value: 3 }
                ],
                valoreCombobox: "",
            },
            computed: {},
            actions: {
                submitTextarea() {
                    document.querySelector("div[obi-textarea]").virtual.context.submitTrigger();
                    console.log("submitTextarea", this.testo);
                }
            },
            events: [
                {
                    name: "progress",
                    action: async function (state) {
                        if(state == "mounted"){
                            this.negozi = await loadNegozi();
                            this.__node.getChildContext("obi-chiplist").update();
                        }
                    }
                }
            ],
            settings: {}
        });

        async function loadNegozi(){
            return await new Promise(resolve => {
                setTimeout(() => {
                    resolve([
                        {label: "001 Negozio 1", value: 1},
                        {label: "002 Negozio 2", value: 2},
                        {label: "003 Negozio 3", value: 3},
                        {label: "004 Negozio 4", value: 4},
                        {label: "005 Negozio 5", value: 5},
                        {label: "006 Negozio 6", value: 6}, 
                    ]);
                }, 1000);
            });
        }
                
        function randomDate() {
            return new Date(Math.random() * (2024 - 2020 + 1) + 2020,
                Math.random() * (12) + 1,
                Math.random() * (29) + 1);
        }

        function elabData(limit) {
            var list = [];
            for (let i = 0; i < limit; i++) {
                list.push({ id: i, nome: Support.uniqueID(), datetime: randomDate() });
            }
            return list;
        }
        function checkFilter(data, filters) {
            if (data == null) return false;
            if (Object.keys(filters).length > 0) {
                for (const key of Object.keys(filters)) {
                    if (filters[key].length && filters[key].find(value => condition(data[key], value)) == null) return false;
                }
            }
            return true;

            function condition(value, filter) {
                if (filter) {
                    switch (typeof value) {
                        case "string": return value.toLowerCase().includes(filter.toString().toLowerCase());
                        case "array": return value.some(e => e.toString().toLowerCase() == filter.toString().toLowerCase());
                        default: return filter == value;
                    }
                }
                return false;
            }
        }

        function getFilter(filters) {
            let filter = {};
            if (Array.isArray(filters)) {
                for (const item of filters) {
                    if (item) {
                        let props = Object.keys(item);
                        for (const key of props) {
                            if (item[key])
                                if (key in filter) filter[key].push(item[key]); else filter[key] = [item[key]];
                        }
                    }
                }
            }
            return filter;
        }

    </script>
</body>

</html>
