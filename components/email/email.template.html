<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,-25" />
    <link type='text/css' rel='stylesheet' href='../../style/StyleBundle.css'>
    <script type='module' src='../../componentsBundle.js'></script>
</head>

<body>

    <div id="template" display-grid="blog" margin="xl" paddin="xl" gap="xl">
        <obi-email grid-article :email="email" :addresses="listaIndirizzi"></obi-email>
        {{email.header.receiver}}
        <obi-button  grid-article @click="syncItem">Sincronizza</obi-button>
    </div>

    <script type="module">
        import RenderEngine from "../../LAMP/RenderModule/LampRender.js";
        import { Support } from '../../LAMP/RenderModule/modules/library.js';
        import EmailRequest from "../../src/models/EmailRequest.js";

        RenderEngine.instance.start("template").build({
            dataset: {
                email: new EmailRequest({
                    header: {
                        receiver: "marco.biagini@obi-italia.it",
                        from: "obi.servizi.commerciali@obi-italia.it",
                        subject: "Welcome to Our Service",
                        body: "",
                    }
                }),
                listaIndirizzi: [
                    { label: "Marco Biagini", value: "marco.biagini@obi-italia.it" },
                    {label: "Andrea Galli", value: "andrea.galli@obi-italia.it" },
                    {label: "Katia Amadori", value: "katia.amadori@obi-italia.it" },
                    { label: "Walter Maggioni", value: "walter.maggioni@obi-italia.it" },
                    { label: "Sabrina Filoni", value: "sabrina.filoni@obi-italia.it"}
                ]
            },
            computed: {},
            actions: {
                syncItem(){
                    this.__node.getChildContext("obi-email").syncForm();
                }
            },
            events: [],
            settings: {}
        });
    </script>
</body>

</html>
