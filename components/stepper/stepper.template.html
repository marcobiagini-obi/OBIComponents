<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,-25" />
    <link type='text/css' rel='stylesheet' href='../../style/StyleBundle.css'>
    <script type='module' src='../../componentsBundle.js'></script>
</head>

<body>

    <div id="template" style="width: 100%;">
        <obi-stepper :steps="steps" :active="active" interact></obi-stepper>
        <group-component>
            <obi-button relevance="secondary" @click="goBack">back</obi-button>
            <obi-button relevance="secondary" @click="done">next</obi-button>
        </group-component>
    </div>

    <script type="module">
        import RenderEngine from "../../LAMP/RenderModule/LampRender.js";
        RenderEngine.instance.start("template").build({
            dataset: {
                steps: [
                    {
                        id: "step1",
                        label: "STEP 1",
                        description: "",
                        status: 0,
                        message: "",
                    },
                    {
                        id: "step2",
                        label: "STEP 2",
                        description: "Opzionale",
                        status: 0,
                        message: "",
                    },
                    {
                        id: "step3",
                        label: "STEP 3",
                        description: "lorem ipsum docet version",
                        status: 0,
                        message: "opzionale",
                    },
                    {
                        id: "step4",
                        label: "STEP 4",
                        description: "",
                        status: 0,
                        message: "",
                    },
                ],
                active: "step1",
            },
            computed: {
                stepper: function () { return document.querySelector("[obi-stepper]").virtual; }
            },
            actions: {
                done() {
                    this.stepper.context.next();
                },
                goBack() {
                    this.stepper.context.back();
                }
            },
            events: [],
            settings: {}
        });
    </script>
</body>

</html>
