<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,-25" />
    <link type='text/css' rel='stylesheet' href='../../style/StyleBundle.css'>
    <script type='module' src='../../componentsBundle.js'></script>
</head>

<body>

    <div id="template" style="width: 100%;">
        <obi-form :modello="item" @action="stampData" relevance="secondary" auto-submit>
            <div slot="inputForm" display-row>
                <obi-textbox :valore="item.id" label="id" disabled type="number" @keyup="editForm"></obi-textbox>
                <obi-textbox :valore="item.idOwner" label="ID Owner" disabled type="number" @keyup="editForm"></obi-textbox>
                <obi-textbox :valore="item.nome" label="Nome" @keyup="editForm"></obi-textbox>
                <obi-date :valore="item.timeStamp" label="Time Stamp" @changed="editForm"></obi-date>
                <obi-textarea :valore="item.note" label="Note" @changed="editForm"></obi-textarea>
            </div>
        </obi-form>
    </div>

    <script type="module">
        import RenderEngine from "../../LAMP/RenderModule/LampRender.js";
        import { Support } from '../../LAMP/RenderModule/modules/library.js';
        import MasterData from "../../src/models/MasterData.js";

        RenderEngine.instance.start("template").build({
            dataset: {
                item: new MasterData(),
            },
            actions:{
                stampData(asset){
                    alert(JSON.stringify(asset));
                },
                editForm(){
                    document.querySelector("[obi-form]").virtual.context.onEdit();
                }
            },
            events: [],
            settings: {}
        });


                
        function randomDate() {
            return new Date(Math.random() * (2024 - 2020 + 1) + 2020,
                Math.random() * (12) + 1,
                Math.random() * (29) + 1);
        }

        function elabData(limit) {
            var list = [];
            for (let i = 0; i < limit; i++) {
                list.push({ id: i, nome: Support.uniqueID(), datetime: randomDate() });
            }
            return list;
        }
        //AND tra proprietà diverse e OR tra stesse proprietà
        function checkFilter(data, filters) {
            if (data == null) return false;
            if (Object.keys(filters).length > 0) {
                //Controllo per ogni proprietà se una sola condizione risulta vera allora la proprietà è vera
                //ma se anche una sola proprietà non rispetta nessuna condizione, essendo le varie proprietà in AND di conseguenza nessuna è giusta.
                for (const key of Object.keys(filters)) {
                    if (filters[key].length && filters[key].find(value => condition(data[key], value)) == null) return false;
                }
            }
            return true;

            function condition(value, filter) {
                if (filter) {
                    switch (typeof value) {
                        case "string": return value.toLowerCase().includes(filter.toString().toLowerCase());
                        case "array": return value.some(e => e.toString().toLowerCase() == filter.toString().toLowerCase());
                        default: return filter == value;
                    }
                }
                return false;
            }
        }

        function getFilter(filters) {
            let filter = {};
            if (Array.isArray(filters)) {
                for (const item of filters) {
                    if (item) {
                        let props = Object.keys(item);
                        for (const key of props) {
                            if (item[key])
                                if (key in filter) filter[key].push(item[key]); else filter[key] = [item[key]];
                        }
                    }
                }
            }
            return filter;
        }

    </script>
</body>

</html>
